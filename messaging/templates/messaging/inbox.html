<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | NOCTRA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #09090f;
            color: white;
            min-height: 100vh;
            padding: 35px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #302444;
        }

        h1 {
            color: #c4a1ff;
            font-size: 30px;
        }

        .subtitle {
            color: #a39ab5;
            margin-top: 8px;
        }

        .back {
            text-decoration: none;
            color: #d7bdff;
            border: 1px solid #8054c7;
            padding: 10px 15px;
            border-radius: 9px;
        }

        .user-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 20px;
            margin-bottom: 14px;
            background: #14121e;
            border: 1px solid #302444;
            border-radius: 14px;
            transition: 0.3s;
        }

        .user-card:hover {
            border-color: #a56bff;
            transform: translateY(-2px);
        }

        .username {
            font-size: 17px;
            font-weight: bold;
            color: white;
            overflow-wrap: anywhere;
        }

        .label {
            color: #a39ab5;
            font-size: 13px;
            margin-top: 6px;
        }

        .chat-button {
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #8054c7, #a56bff);
            padding: 11px 17px;
            border-radius: 9px;
            font-weight: bold;
            white-space: nowrap;
        }

        .empty {
            background: #14121e;
            border: 1px solid #302444;
            border-radius: 14px;
            padding: 45px 20px;
            text-align: center;
            color: #a39ab5;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        @media (max-width: 480px) {
            body {
                padding: 22px 14px;
            }

            h1 {
                font-size: 25px;
            }

            .user-card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header>
            <div>
                <h1>💬 NOCTRA Messages</h1>
                <p class="subtitle">Your conversations begin here.</p>
            </div>

            <a href="{% url 'feed' %}" class="back">← Feed</a>
        </header>

        {% for person in users %}
            <article class="user-card">
                <div>
                    <div class="username">@{{ person.username }}</div>
                    <p class="label">Connect privately on NOCTRA</p>
                </div>

                <a
                    href="{% url 'chat' person.username %}"
                    class="chat-button"
                >
                    Message ✨
                </a>
            </article>
        {% empty %}
            <section class="empty">
                <div class="empty-icon">🌙</div>
                <h2>No users yet</h2>
                <p>Create another account to start a conversation!</p>
            </section>
        {% endfor %}

    </main>
</body>
</html>
